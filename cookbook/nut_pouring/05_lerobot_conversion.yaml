# Step 5: Convert HDF5 to LeRobot dataset format for GROOT training
# Usage: osmo workflow submit 05_lerobot_conversion.yaml --pool default

workflow:
  name: {{workflow_name}}
  timeout:
    exec_timeout: 168h # 7 days
    queue_timeout: 48h
  resources:
    default:
      cpu: {{ num_cpu }}
      gpu: {{ num_gpu }}
      memory: {{ memory }}
      storage: {{ storage }}

  tasks:
  - name: master  # Master task for torchrun
    image: {{ image_name }}
    environment:
      ACCEPT_EULA: Y
      NO_NUCLEUS: Y
      OMNI_KIT_ALLOW_ROOT: 1

    inputs:
    - dataset:
        name: {{ input_dataset }}

    outputs:
    - dataset:
        name: {{ output_dataset }}

    command: ["bash"]
    args: ["/tmp/entry.sh"]
    files:
    - path: /tmp/entry.sh
      contents: |

          set -euo pipefail

          isaaclab_python() {
            /workspace/isaaclab/isaaclab.sh -p "$@"
          }

          echo "=== System Info ==="
          nvidia-smi || true

          apt-get update && apt-get install -y \
            git \
            ffmpeg \
            libsm6 \
            libxext6

          echo "=== Clone IsaacLabEvalTasks ==="
          cd /workspace
          git clone --depth 1 https://github.com/isaac-sim/IsaacLabEvalTasks.git
          cd IsaacLabEvalTasks/scripts

          # Keep the IsaacLab runtime stable: install only missing lightweight deps.
          if ! isaaclab_python - <<'PY'
          import importlib.util
          import sys
          modules = ["numpy", "h5py", "pandas", "tyro", "torchvision", "tqdm", "yaml", "cv2", "pyarrow", "av"]
          missing = [m for m in modules if importlib.util.find_spec(m) is None]
          print("Missing modules:", ",".join(missing) if missing else "none")
          sys.exit(1 if missing else 0)
          PY
          then
            isaaclab_python -m pip install --no-cache-dir \
              pandas \
              tyro \
              tqdm \
              pyyaml \
              opencv-python-headless \
              pyarrow \
              av==12.3.0
          fi

          echo "=== Prepare Input HDF5 ==="
          DATASET_DIR=/tmp/dataset_conversion
          mkdir -p "$DATASET_DIR"
          HDF5_FILE=$(find {{input:0}} -name "*.hdf5" -type f | head -n 1 || true)
          if [[ -z "$HDF5_FILE" ]]; then
            echo "No HDF5 file found in {{input:0}}"
            exit 1
          fi
          echo "Using HDF5: $HDF5_FILE"
          cp "$HDF5_FILE" "$DATASET_DIR/nut_pouring_task.hdf5"

          echo "=== Convert HDF5 to LeRobot ==="
          isaaclab_python convert_hdf5_to_lerobot.py \
            --task-name nutpouring \
            --data-root "$DATASET_DIR"

          if [[ ! -d "$DATASET_DIR/nut_pouring_task/lerobot" ]]; then
            echo "LeRobot output directory missing after conversion"
            find "$DATASET_DIR" -maxdepth 4 -type f | head -n 50 || true
            exit 1
          fi

          echo "=== Export Output Dataset ==="
          mkdir -p {{output}}/nut_pouring_task
          cp -r "$DATASET_DIR/nut_pouring_task/lerobot" {{output}}/nut_pouring_task/
          find {{output}} -maxdepth 5 -type f | head -n 50 || true


# Update default values
default-values:
  workflow_name: dataset_conversion_augmented
  memory: 128Gi
  storage: 256Gi
  num_gpu: 1
  num_cpu: 32
  platform: ovx-a40
  image_name: nvcr.io/nvidia/isaac-lab:2.3.0
  input_dataset: PhysAI-CosmosAugmentedHDF5
  output_dataset: PhysAI-LeRobotDataset
