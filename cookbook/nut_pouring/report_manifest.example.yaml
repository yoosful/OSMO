pitfalls:
  - Missing HF gated approvals for Cosmos/GR00T models.
  - Incorrect Step 3 output selection (must keep generated robot camera MP4).
  - Step 4 schema mismatch if converter assumes generic table_cam/eef_pos keys.
  - Attempting aggressive multi-GPU settings before baseline single-GPU verification.
  - Leaving GPU nodegroups up after run if idle autoscaler is not enabled.

cost_control:
  - Idle scale-down is automated for this environment.
  - "Automation script: deployments/scripts/aws/auto-scale-idle.sh"
  - "Cron: */5 * * * * .../auto-scale-idle.sh --once --cluster osmo --region us-west-2 --osmo-namespace osmo-minimal --idle-minutes 20 --cpu-desired 1"
  - One-shot cleanup executed after workflow completion: osmo-groot desired=0, osmo-gpu desired=0, osmo-nodes desired=1.
  - Final node state: only CPU baseline node remains in cluster.

