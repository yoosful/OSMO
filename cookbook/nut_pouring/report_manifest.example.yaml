  - Steps 1-5 GPU nodegroup: osmo-gpu using `g5.12xlarge` or `g5.16xlarge` from Terraform.
  - Step 6 GR00T nodegroup: osmo-groot using `p4d.24xlarge` from Terraform.
  - Cleanup target after run: osmo-gpu desired=0, osmo-groot desired=0, osmo-nodes desired=1.

